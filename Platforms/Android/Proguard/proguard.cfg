# Preserve MAUI and VPN service classes
-keep class Microsoft.Maui.** { *; }
-keep class IPBlockerLogger.** { *; }
-keep class IP_Blocker_Logger.** { *; }

# Preserve Android VPN service classes
-keep class android.net.VpnService { *; }
-keep class * extends android.net.VpnService { *; }

# Preserve notification classes
-keep class android.app.Notification** { *; }
-keep class android.app.NotificationManager { *; }